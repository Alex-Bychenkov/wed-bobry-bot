name: Deploy to Server

# Запускается вручную из GitHub UI
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Подтвердите деплой (напишите "deploy")'
        required: true
        default: ''
      clear_metrics:
        description: 'Очистить все накопленные метрики Prometheus'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /opt/wed-bobry-bot
            
            # Получаем изменения из Git
            git fetch origin
            git reset --hard origin/main
            
            # Останавливаем и удаляем контейнеры (включая "осиротевшие")
            docker compose down --remove-orphans
            
            # Принудительно удаляем контейнер, если остался
            docker rm -f wed-bobry-bot 2>/dev/null || true
            
            # Запускаем новый контейнер
            docker compose up -d --build
            
            # Обновляем конфигурацию мониторинга
            if [ -d monitoring ]; then
              echo "📊 Обновление конфигурации мониторинга..."
              # Дашборды Grafana
              cp -r monitoring/grafana/dashboards/* /opt/monitoring/grafana/dashboards/ 2>/dev/null || true
              # Конфигурация Prometheus (alerts, prometheus.yml)
              cp monitoring/alerts.yml /opt/monitoring/alerts.yml 2>/dev/null || true
              cp monitoring/prometheus.yml /opt/monitoring/prometheus.yml 2>/dev/null || true
              cp monitoring/alertmanager.yml /opt/monitoring/alertmanager.yml 2>/dev/null || true
              echo "✅ Конфигурация мониторинга обновлена"
            fi
            
            # Перезапускаем мониторинг (Grafana, Prometheus) для применения изменений
            if [ -f /opt/monitoring/docker-compose.monitoring.yml ]; then
              cd /opt/monitoring
              
              # Проверяем, нужна ли очистка метрик
              if [ "${{ github.event.inputs.clear_metrics }}" = "true" ]; then
                echo "🗑️ Очистка всех накопленных метрик Prometheus..."
                docker compose -f docker-compose.monitoring.yml down
                docker volume rm monitoring_prometheus_data 2>/dev/null || true
                docker compose -f docker-compose.monitoring.yml up -d
                echo "✅ Метрики очищены, мониторинг перезапущен"
              else
                echo "🔄 Перезапуск мониторинга..."
                docker compose -f docker-compose.monitoring.yml restart grafana prometheus
                echo "✅ Мониторинг перезапущен"
              fi
              
              cd /opt/wed-bobry-bot
            fi
            
            # Показываем статус
            echo "✅ Деплой завершён"
            docker compose ps
            docker compose -f /opt/monitoring/docker-compose.monitoring.yml ps 2>/dev/null || true

      - name: Deployment complete
        run: echo "✅ Бот успешно обновлён на сервере!"
