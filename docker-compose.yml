networks:
  monitoring:
    external: true
    name: monitoring

services:
  wed-bobry-bot:
    build: .
    container_name: wed-bobry-bot
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/app/data
    # Порт НЕ публикуем наружу — Prometheus ходит через Docker-сеть monitoring.
    # Это предотвращает блокировку metrics-сервера интернет-сканерами.
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - monitoring
    # Ограничения ресурсов. Бот с aiogram 3.27 занимает ~120 МБ RSS (см. requirements.txt),
    # 256M даёт запас на всплески в среду 11:00. 120M было мало — OOM и BotDown.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 80M
    mem_limit: 256m
    memswap_limit: 320m
    # Healthcheck: при недоступности /metrics контейнер перезапустится
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
